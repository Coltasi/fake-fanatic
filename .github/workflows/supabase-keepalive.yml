name: Supabase keep-alive

# Free Supabase projects pause after ~7 days of inactivity.
# This queries the database every 3 days so Fake Fanatic stays awake.
# The key below is the project's publishable (public) key, safe to commit.
on:
  schedule:
    - cron: "17 7 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase
        run: |
          code=$(curl -sS -m 30 -o /tmp/resp.txt -w "%{http_code}" \
            "https://oosvkgeaxotgueuhuumq.supabase.co/rest/v1/waitlist?select=*&limit=1" \
            -H "apikey: sb_publishable_s6urErnf8ptY4d9sX0RRpQ_WeLVcT6R" -H "Authorization: Bearer sb_publishable_s6urErnf8ptY4d9sX0RRpQ_WeLVcT6R")
          echo "HTTP $code"
          head -c 300 /tmp/resp.txt; echo
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "Keep-alive failed"; exit 1
          fi
