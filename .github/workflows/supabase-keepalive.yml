name: Supabase keep-alive

# Free Supabase projects pause after ~7 days of inactivity.
# Every 3 days this calls the live site's /api/status, which runs a real database query
# with the server key (the earlier direct query with the public key was refused, so it
# didn't count as activity and the project paused). Fails if the database check fails,
# so GitHub emails you.
on:
  schedule:
    - cron: "17 7 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database through /api/status
        run: |
          body=$(curl -sS -m 30 -H "Cache-Control: no-cache" "https://www.fakefanatic.com/api/status?t=$(date +%s)")
          echo "$body"
          echo "$body" | grep -q '"signups":true' || { echo "Database check failed"; exit 1; }
