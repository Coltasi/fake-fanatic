<script>
  // /r/CODE: remember who referred this visitor for 30 days, then go to the home page.

    var m = location.pathname.match(/^\/r\/([A-Za-z0-9]{4,12})\/?$/);

      document.cookie = 'ff_ref=' + m[1].toUpperCase() + '; path=/; max-age=2592000; SameSite=Lax' +
        (location.protocol === 'https:' ? '; Secure' : '');
    }
    location.replace('/' + location.search);
  })();
</script>
